<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sequence Studio</title>
    <script>
      // The theme before the first paint: the stored choice, else light (src/_components/ThemeToggle/useTheme.ts).
      (function () {
        var theme = "light";
        try {
          var stored = window.localStorage.getItem("sequence-studio.theme");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch (error) {
          // Blocked storage: light.
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
